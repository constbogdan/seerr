# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Downstream Image

on:
  push:
    branches: [downstream-main]

permissions: {}

concurrency:
  group: downstream-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/constbogdan/seerr

jobs:
  eligibility:
    name: Determine image eligibility
    if: github.repository == 'constbogdan/seerr' && github.ref == 'refs/heads/downstream-main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      release_required: ${{ steps.plan.outputs.release_required }}
      version_tag: ${{ steps.plan.outputs.version_tag }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
      source_date_epoch: ${{ steps.plan.outputs.source_date_epoch }}
      previous_sha: ${{ steps.plan.outputs.previous_sha }}
      comparison_baseline_sha: ${{ steps.plan.outputs.comparison_baseline_sha }}
      image_already_published: ${{ steps.plan.outputs.image_already_published }}
      upstream_authenticated: ${{ steps.plan.outputs.upstream_authenticated }}
      upstream_base_sha: ${{ steps.plan.outputs.upstream_base_sha }}
      upstream_tip_sha: ${{ steps.plan.outputs.upstream_tip_sha }}
      managed_candidate_sha: ${{ steps.plan.outputs.managed_candidate_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate eligibility context
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'constbogdan/seerr'
          test "$GITHUB_REF" = 'refs/heads/downstream-main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry for metadata
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read previous published image identity
        id: previous
        shell: bash
        run: |
          metadata_file="${RUNNER_TEMP}/previous-image-metadata.json"
          if ! docker buildx imagetools inspect --format '{{json .}}' "${IMAGE_NAME}:custom" > "$metadata_file"; then
            echo 'Unable to inspect the existing rolling downstream image.' >&2
            exit 1
          fi
          python3 -B scripts/seerr_downstream_version.py \
            --parse-image-metadata \
            --github-output "$GITHUB_OUTPUT" < "$metadata_file"

      - name: Classify exact unpublished range
        id: plan
        env:
          PREVIOUS_SHA: ${{ steps.previous.outputs.previous_sha }}
          PREVIOUS_VERSION_TAG: ${{ steps.previous.outputs.previous_version_tag }}
        run: >-
          python3 -B scripts/seerr_downstream_version.py
          --publication --plan-publication
          --previous-sha "$PREVIOUS_SHA"
          --previous-version-tag "$PREVIOUS_VERSION_TAG"
          --github-output "$GITHUB_OUTPUT"

      - name: Record skipped publication
        if: steps.plan.outputs.release_required != 'true'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## No downstream image required

          The exact unpublished range `${{ steps.plan.outputs.previous_sha }}...${GITHUB_SHA}`
          is `${{ steps.plan.outputs.release_relevance }}`. The rolling `custom` tag and
          downstream version remain unchanged.
          EOF

  publish:
    name: Publish downstream image
    needs: eligibility
    if: needs.eligibility.outputs.release_required == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      build_digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate publication context
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'constbogdan/seerr'
          test "$GITHUB_REF" = 'refs/heads/downstream-main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set build metadata
        id: build_metadata
        if: needs.eligibility.outputs.image_already_published != 'true'
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ needs.eligibility.outputs.source_date_epoch }}
        run: |
          created="$(date -u --date="@${SOURCE_DATE_EPOCH}" +'%Y-%m-%dT%H:%M:%SZ')"
          echo "created=$created" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: needs.eligibility.outputs.image_already_published != 'true'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        if: needs.eligibility.outputs.image_already_published != 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        if: needs.eligibility.outputs.image_already_published != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.eligibility.outputs.version_tag }}
            type=raw,value=${{ github.sha }}
            type=raw,value=custom
          labels: |
            org.opencontainers.image.title=Seerr personal downstream
            org.opencontainers.image.description=Personal downstream build of Seerr, tracking seerr-team/seerr with selected custom features and fixes. Not an official Seerr release. Official project: https://github.com/seerr-team/seerr
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/downstream-main/docs/SEERR_DOWNSTREAM_PACKAGE.md
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.eligibility.outputs.version_tag }}
            org.opencontainers.image.created=${{ steps.build_metadata.outputs.created }}
          annotations: |
            org.opencontainers.image.title=Seerr personal downstream
            org.opencontainers.image.description=Personal downstream build of Seerr, tracking seerr-team/seerr with selected custom features and fixes. Not an official Seerr release. Official project: https://github.com/seerr-team/seerr
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/blob/downstream-main/docs/SEERR_DOWNSTREAM_PACKAGE.md
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.eligibility.outputs.version_tag }}
            org.opencontainers.image.created=${{ steps.build_metadata.outputs.created }}

      - name: Build and publish image
        id: publish
        if: needs.eligibility.outputs.image_already_published != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            BUILD_VERSION=${{ needs.eligibility.outputs.version_tag }}
            BUILD_CHANNEL=downstream
            SOURCE_DATE_EPOCH=${{ needs.eligibility.outputs.source_date_epoch }}
          labels: ${{ steps.metadata.outputs.labels }}
          annotations: ${{ steps.metadata.outputs.annotations }}
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha,scope=downstream-linux-amd64
          cache-to: type=gha,mode=max,scope=downstream-linux-amd64,ignore-error=true
          provenance: false

      - name: Publish summary
        if: needs.eligibility.outputs.image_already_published != 'true'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Seerr downstream ${{ needs.eligibility.outputs.version_tag }} published

          - **Image:** `${IMAGE_NAME}`
          - **Version:** `${{ needs.eligibility.outputs.version_tag }}`
          - **Source SHA:** `${GITHUB_SHA}`
          - **Immutable tag:** `${IMAGE_NAME}:${GITHUB_SHA}`
          - **Version tag:** `${IMAGE_NAME}:${{ needs.eligibility.outputs.version_tag }}`
          - **Rolling tag:** `${IMAGE_NAME}:custom`
          - **Digest:** `${{ steps.publish.outputs.digest }}`
          - **Build:** [${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          ### Upstream synchronization

          ${{ needs.eligibility.outputs.upstream_authenticated == 'true' && format('Authenticated managed candidate `{0}` integrated upstream `{1}...{2}`.', needs.eligibility.outputs.managed_candidate_sha, needs.eligibility.outputs.upstream_base_sha, needs.eligibility.outputs.upstream_tip_sha) || 'No authenticated managed upstream candidate exists in this publication range.' }}

          ### Downstream changes

          [Compare the previous published image with this version](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/${{ needs.eligibility.outputs.previous_sha }}...${GITHUB_SHA}).
          EOF

      - name: Record image publication recovery
        if: needs.eligibility.outputs.image_already_published == 'true'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Recovering downstream release publication

          `${IMAGE_NAME}:${{ needs.eligibility.outputs.version_tag }}` already records
          the exact protected source `${GITHUB_SHA}`. The image will not be rebuilt;
          its immutable registry identity will be reverified before the missing Git
          tag or GitHub Release is reconciled.
          EOF

  release:
    name: Publish downstream release
    needs: [eligibility, publish]
    if: needs.eligibility.outputs.release_required == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate release context
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
        run: |
          test "$GITHUB_REPOSITORY" = 'constbogdan/seerr'
          test "$GITHUB_REF" = 'refs/heads/downstream-main'
          test "$GITHUB_SHA" = "$EXPECTED_SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry for verification
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read published image identities
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
          VERSION_TAG: ${{ needs.eligibility.outputs.version_tag }}
        run: |
          docker buildx imagetools inspect --format '{{json .}}' \
            "${IMAGE_NAME}:${VERSION_TAG}" > "${RUNNER_TEMP}/version-image.json"
          docker buildx imagetools inspect --format '{{json .}}' \
            "${IMAGE_NAME}:${SOURCE_SHA}" > "${RUNNER_TEMP}/source-image.json"
          docker buildx imagetools inspect --format '{{json .}}' \
            "${IMAGE_NAME}:custom" > "${RUNNER_TEMP}/rolling-image.json"

      - name: Verify published image identity
        id: image
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
          VERSION_TAG: ${{ needs.eligibility.outputs.version_tag }}
          EXPECTED_DIGEST: ${{ needs.publish.outputs.build_digest }}
          IMAGE_ALREADY_PUBLISHED: ${{ needs.eligibility.outputs.image_already_published }}
        run: |
          python3 -B scripts/seerr_downstream_release.py verify-image \
            --source-sha "$SOURCE_SHA" \
            --version-tag "$VERSION_TAG" \
            --version-metadata "${RUNNER_TEMP}/version-image.json" \
            --source-metadata "${RUNNER_TEMP}/source-image.json" \
            --rolling-metadata "${RUNNER_TEMP}/rolling-image.json" \
            --expected-digest "$EXPECTED_DIGEST" \
            --image-already-published "$IMAGE_ALREADY_PUBLISHED" \
            --github-output "$GITHUB_OUTPUT"

      - name: Create or verify Git tag and GitHub Release
        id: github_release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
          BASELINE_SHA: ${{ needs.eligibility.outputs.comparison_baseline_sha }}
          VERSION_TAG: ${{ needs.eligibility.outputs.version_tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
        run: |
          python3 -B scripts/seerr_downstream_release.py publish-release \
            --source-sha "$SOURCE_SHA" \
            --baseline-sha "$BASELINE_SHA" \
            --version-tag "$VERSION_TAG" \
            --image-digest "$IMAGE_DIGEST" \
            --notes "${RUNNER_TEMP}/release-notes.md" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish release summary
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.eligibility.outputs.source_sha }}
          VERSION_TAG: ${{ needs.eligibility.outputs.version_tag }}
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          RELEASE_URL: ${{ steps.github_release.outputs.url }}
          RELEASE_OUTCOME: ${{ steps.github_release.outputs.outcome }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Seerr downstream ${VERSION_TAG} release ${RELEASE_OUTCOME}

          - **GitHub Release:** [${VERSION_TAG}](${RELEASE_URL})
          - **Image:** `${IMAGE_NAME}:${VERSION_TAG}`
          - **Source SHA:** `${SOURCE_SHA}`
          - **Digest:** `${IMAGE_DIGEST}`
          - **Build:** [${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF
