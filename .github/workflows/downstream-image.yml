---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Downstream Image

on:
  push:
    branches:
      - downstream-main

permissions:
  contents: read
  packages: write

concurrency:
  group: downstream-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/constbogdan/seerr

jobs:
  publish:
    name: Publish downstream image
    if: github.repository == 'constbogdan/seerr' && github.ref == 'refs/heads/downstream-main'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate publication context
        shell: bash
        run: |
          test "$GITHUB_REPOSITORY" = 'constbogdan/seerr'
          test "$GITHUB_REF" = 'refs/heads/downstream-main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set build metadata
        id: build_metadata
        shell: bash
        run: |
          echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=downstream
          labels: |
            org.opencontainers.image.title=Seerr downstream
            org.opencontainers.image.description=Maintained downstream Seerr image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.build_metadata.outputs.created }}

      - name: Build and publish image
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COMMIT_TAG=${{ github.sha }}
            BUILD_VERSION=downstream
            SOURCE_DATE_EPOCH=${{ steps.build_metadata.outputs.source_date_epoch }}
          labels: ${{ steps.metadata.outputs.labels }}
          tags: ${{ steps.metadata.outputs.tags }}
          cache-from: type=gha,scope=downstream-linux-amd64
          cache-to: type=gha,mode=max,scope=downstream-linux-amd64
          provenance: false

      - name: Publish summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Downstream image published

          - **Image:** \`${IMAGE_NAME}\`
          - **Source SHA:** \`${GITHUB_SHA}\`
          - **Immutable tag:** \`${IMAGE_NAME}:${GITHUB_SHA}\`
          - **Rolling tag:** \`${IMAGE_NAME}:downstream\`
          - **Digest:** \`${{ steps.publish.outputs.digest }}\`
          - **Build:** [${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})
          EOF
